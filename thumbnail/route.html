<!doctype html>
<!--
  MERITALIEN — LinkedIn thumbnail, variant A: ROUTE-LED
  1200 x 627 (1.91:1). See thumb.css for why the photo is duotoned.

  This is the brand's own signature component doing the work: origin -> destination.
  The green destination marker is the only colour in the frame.

  Copy note: this deliberately does NOT use "Making exceptional talent borderless."
  That line is the Page tagline and already appears under the cover; repeating it
  here would print it twice on the same screen.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="thumb.css">
<style>
  .stage { padding: 68px 76px 60px; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .note { font-family: Newsreader, Georgia, serif; font-style: italic;
          font-size: 31px; color: #d8d4cd; letter-spacing: 0.005em; }
  .foot { display: flex; justify-content: space-between; align-items: baseline;
          padding-top: 22px; }
  .site { font-family: var(--mono); font-size: 17px; letter-spacing: 0.16em;
          text-transform: uppercase; color: var(--invert-muted); }
</style>
</head>
<body>
  <div class="stage">
    <div class="photo"></div>
    <div class="scrim"></div>

    <div class="top">
      <span class="eyebrow">Global talent mobility</span>
      <span class="eyebrow" style="color:var(--invert-muted)">One of ten routes</span>
    </div>

    <div class="mid">
      <div class="route">
        <span class="route__from">Mumbai</span>
        <span class="route__track"></span>
        <span>San&nbsp;Francisco</span>
      </div>
      <p class="note">Three-year status. Self-petitioned &mdash; no employer sponsor.</p>
    </div>

    <hr class="rule">
    <div class="foot">
      <span class="wordmark">Merit<span>alien</span></span>
      <span class="site">meritalien.com</span>
    </div>
  </div>
</body>
</html>
