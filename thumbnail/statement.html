<!doctype html>
<!--
  MERITALIEN — LinkedIn thumbnail, variant B: STATEMENT-LED
  1200 x 627 (1.91:1).

  Uses a line the Page tagline does not: a reframe rather than a belief. The
  canvas is much bigger than the Page cover's 191px strip, so this variant can
  carry a sentence rather than a phrase.

  The accent lands on ONE word, in serif italic -- the same move the hero makes
  with "borders". Serif is reserved for statements in this system, so the serif
  italic carries the word that matters.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="thumb.css">
<style>
  .stage { padding: 68px 76px 60px; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  h1 {
    font-family: Geist, system-ui, sans-serif;
    font-weight: 500;
    font-size: 74px;
    line-height: 1.08;
    letter-spacing: -0.032em;
    max-width: 900px;
  }
  h1 em {
    font-family: Newsreader, Georgia, serif;
    font-style: italic; font-weight: 400;
    color: var(--accent);
    letter-spacing: -0.012em;
  }
  .foot { display: flex; justify-content: space-between; align-items: baseline;
          padding-top: 22px; }
  .site { font-family: var(--mono); font-size: 17px; letter-spacing: 0.16em;
          text-transform: uppercase; color: var(--invert-muted); }
</style>
</head>
<body>
  <div class="stage">
    <div class="photo"></div>
    <div class="scrim"></div>

    <div class="top">
      <span class="eyebrow">Global talent mobility</span>
      <span class="eyebrow" style="color:var(--invert-muted)">O-1A &middot; EB-1A &middot; EB-2 NIW</span>
    </div>

    <div class="mid">
      <h1>The visa is the last step.<br>The evidence is the <em>work</em>.</h1>
    </div>

    <hr class="rule">
    <div class="foot">
      <span class="wordmark">Merit<span>alien</span></span>
      <span class="site">meritalien.com</span>
    </div>
  </div>
</body>
</html>
