<!doctype html>
<!--
  MERITALIEN — LinkedIn company-page cover  (v3, measured against the live render)
  ============================================================
  v1 and v2 were built against an ASSUMED logo position. A screenshot of the real
  Page showed the truth, and it was worse than assumed:

    - LinkedIn renders the cover at 6.04:1, not 5.906:1. It trims ~2% of the height.
    - The Page logo is not a small tile in the corner. Measured off the live
      screenshot, its top edge lands ~25% down the cover and it spans the left
      ~21% of the width. So it eats a tall block of the LEFT SIDE, not a corner.

  v2 put the headline at x=56. The logo covered the first ~180px of it and the
  Page read "...ceptional talent borderless." That is the failure this file fixes.

  RULE: all copy starts at x = 268, clear of the logo's measured right edge
  (~240px). Nothing important sits left of that below y = 40.

  Photo: Carol M. Highsmith / Library of Congress, CC0 — no attribution obligation
  on a commercial Page. Crop x 0..1831, y 440..750 is chosen so the Statue of
  Liberty falls at ~86% of the frame, leaving the middle for the copy column.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Geist; src: url("../assets/fonts/Geist-Medium.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: Geist; src: url("../assets/fonts/Geist-Regular.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: Newsreader; src: url("../assets/fonts/Newsreader-Italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: block; }
  @font-face { font-family: "Departure Mono"; src: url("../assets/fonts/DepartureMono-Regular.woff2") format("woff2"); font-display: block; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  .stage {
    position: relative; width: 1128px; height: 191px; overflow: hidden;
    background: #0b0b0c;
  }
  .stage__photo {
    position: absolute; inset: 0;
    background-image: url("img/band.jpg");
    background-size: 100% 100%;
  }
  /* One gradient only. An earlier version stacked a flat scrim under a gradient;
     they multiplied and crushed the photo to near-black, losing the statue. */
  .stage__grad {
    position: absolute; inset: 0;
    background: linear-gradient(
      90deg,
      rgba(11,11,12,0.86) 0%,
      rgba(11,11,12,0.74) 26%,
      rgba(11,11,12,0.48) 52%,
      rgba(11,11,12,0.10) 100%
    );
  }

  /* the column everything sits in -- starts clear of the logo */
  .copy { position: absolute; left: 268px; top: 30px; right: 52px; }

  .labels {
    font-family: "Departure Mono", monospace;
    font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #fbfaf8;
    text-shadow: 0 1px 3px rgba(6,6,7,0.92), 0 0 14px rgba(6,6,7,0.75);
  }

  h1 {
    margin-top: 14px;
    font-family: Geist, system-ui, sans-serif;
    font-weight: 500;
    font-size: 38px;
    line-height: 1.06;
    letter-spacing: -0.028em;
    color: #fbfaf8;
    text-shadow: 0 1px 4px rgba(6,6,7,0.60);
    max-width: 560px;
  }
  /* the single accent: "borderless" is the word the brand rests on */
  h1 em {
    font-family: Newsreader, Georgia, serif;
    font-style: italic; font-weight: 400;
    color: #00e07a;
    letter-spacing: -0.01em;
  }

  .routes {
    position: absolute; left: 268px; top: 150px;
    font-family: "Departure Mono", monospace;
    font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase;
    color: #cdc9c2;
    text-shadow: 0 1px 3px rgba(6,6,7,0.92), 0 0 12px rgba(6,6,7,0.7);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="stage__photo"></div>
    <div class="stage__grad"></div>
    <div class="copy">
      <p class="labels">Global talent mobility</p>
      <h1>Making exceptional<br>talent <em>borderless</em>.</h1>
    </div>
    <p class="routes">O-1A &middot; EB-1A &middot; EB-2 NIW &middot; UK Global Talent</p>
  </div>
</body>
</html>
